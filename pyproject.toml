[project]
name = "vendorlens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aldrin-Shanty", email = "aldrinshanty22@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "click==8.5.0",
    "dnspython==2.8.0",
    "email-validator==2.3.0",
    "fastapi==0.142.2",
    "h11==0.16.0",
    "idna==3.20",
    "opentelemetry-api==1.45.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.3",
    "starlette==1.7.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
vendorlens = "vendorlens:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
